<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}
nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}
nav .brand{color:#38bdf8;font-weight:700;font-size:18px}
.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}
#app{max-width:420px;margin:32px auto;padding:0 16px 40px}
h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.subtitle{text-align:center;color:#94a3b8;font-size:14px;margin-bottom:20px}
.calc{background:#1e293b;border-radius:20px;border:1px solid #334155;overflow:hidden}
#display{background:#0f172a;padding:16px 18px 12px;text-align:right}
#expr{font-size:13px;color:#64748b;min-height:18px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#result{font-family:monospace;font-size:36px;font-weight:300;color:#f1f5f9;min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-row{display:flex;gap:0;border-bottom:1px solid #334155}
.mode-btn{flex:1;background:none;border:none;color:#64748b;padding:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.mode-btn.active{background:#1e40af;color:#93c5fd}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#334155}
.grid-4{grid-template-columns:repeat(4,1fr)}
button.key{background:#1e293b;border:none;color:#f1f5f9;padding:0;height:52px;font-size:15px;font-weight:500;cursor:pointer;transition:background .1s}
button.key:active{background:#334155}
button.key.op{background:#1e3a5f;color:#93c5fd}
button.key.op:active{background:#1e40af}
button.key.eq{background:#2563eb;color:#fff;font-size:20px;font-weight:700}
button.key.eq:active{background:#1d4ed8}
button.key.fn{background:#1a2535;color:#94a3b8;font-size:13px}
button.key.fn:active{background:#334155}
button.key.clear{color:#ef4444}
button.key.span2{grid-column:span 2}
</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="app">
  <h1>Scientific Calculator</h1>
  <p class="subtitle">Trig · Log · Powers · Roots · Constants</p>
  <div class="calc">
    <div id="display">
      <div id="expr"></div>
      <div id="result">0</div>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" id="deg-btn" onclick="setMode('deg')">DEG</button>
      <button class="mode-btn" id="rad-btn" onclick="setMode('rad')">RAD</button>
      <button class="mode-btn" id="inv-btn" onclick="toggleInv()">INV</button>
    </div>
    <!-- Scientific row -->
    <div class="grid" id="sci-grid">
      <button class="key fn" onclick="fn('sin')">sin</button>
      <button class="key fn" onclick="fn('cos')">cos</button>
      <button class="key fn" onclick="fn('tan')">tan</button>
      <button class="key fn" onclick="fn('log')">log</button>
      <button class="key fn" onclick="fn('ln')">ln</button>

      <button class="key fn" onclick="fn('sqrt')">√x</button>
      <button class="key fn" onclick="fn('cbrt')">∛x</button>
      <button class="key fn" onclick="inputOp('^')">xʸ</button>
      <button class="key fn" onclick="fn('abs')">|x|</button>
      <button class="key fn" onclick="fn('fact')">n!</button>

      <button class="key fn" onclick="inputConst('PI')">π</button>
      <button class="key fn" onclick="inputConst('E')">e</button>
      <button class="key fn" onclick="inputChar('(')"> ( </button>
      <button class="key fn" onclick="inputChar(')')"> ) </button>
      <button class="key fn" onclick="inputOp('%')">%</button>
    </div>
    <!-- Standard grid -->
    <div class="grid grid-4">
      <button class="key clear" onclick="clearAll()">AC</button>
      <button class="key fn" onclick="delLast()">⌫</button>
      <button class="key fn" onclick="toggleSign()">±</button>
      <button class="key op" onclick="inputOp('/')">÷</button>

      <button class="key" onclick="inputChar('7')">7</button>
      <button class="key" onclick="inputChar('8')">8</button>
      <button class="key" onclick="inputChar('9')">9</button>
      <button class="key op" onclick="inputOp('*')">×</button>

      <button class="key" onclick="inputChar('4')">4</button>
      <button class="key" onclick="inputChar('5')">5</button>
      <button class="key" onclick="inputChar('6')">6</button>
      <button class="key op" onclick="inputOp('-')">−</button>

      <button class="key" onclick="inputChar('1')">1</button>
      <button class="key" onclick="inputChar('2')">2</button>
      <button class="key" onclick="inputChar('3')">3</button>
      <button class="key op" onclick="inputOp('+')">+</button>

      <button class="key span2" onclick="inputChar('0')">0</button>
      <button class="key" onclick="inputChar('.')">.</button>
      <button class="key eq" onclick="calculate()">=</button>
    </div>
  </div>
</div>
<script>
var expr = '';
var lastResult = null;
var degMode = true;
var invMode = false;
var justEvaled = false;

var exprEl = document.getElementById('expr');
var resultEl = document.getElementById('result');

function toRad(x){ return degMode ? x * Math.PI / 180 : x; }

function setMode(m){
  degMode = m === 'deg';
  document.getElementById('deg-btn').className = 'mode-btn' + (degMode ? ' active' : '');
  document.getElementById('rad-btn').className = 'mode-btn' + (!degMode ? ' active' : '');
}
function toggleInv(){
  invMode = !invMode;
  document.getElementById('inv-btn').className = 'mode-btn' + (invMode ? ' active' : '');
  var labels = invMode
    ? ['asin','acos','atan','10^x','e^x','x²','x³','xʸ','|x|','n!']
    : ['sin','cos','tan','log','ln','√x','∛x','xʸ','|x|','n!'];
  var fns  = invMode
    ? [function(){fn('asin');},function(){fn('acos');},function(){fn('atan');},function(){fn('pow10');},function(){fn('exp');},function(){fn('sq');},function(){fn('cube');},function(){inputOp('^');},function(){fn('abs');},function(){fn('fact');}]
    : [function(){fn('sin');},function(){fn('cos');},function(){fn('tan');},function(){fn('log');},function(){fn('ln');},function(){fn('sqrt');},function(){fn('cbrt');},function(){inputOp('^');},function(){fn('abs');},function(){fn('fact');}];
  var btns = document.querySelectorAll('#sci-grid button');
  for(var i=0;i<10;i++){ btns[i].textContent=labels[i]; btns[i].onclick=fns[i]; }
}

function display(){ resultEl.textContent = expr || '0'; exprEl.textContent = ''; }
function updatePreview(){
  try { var v = evalExpr(expr); if(!isNaN(v) && isFinite(v)) exprEl.textContent = '= ' + fmt(v); else exprEl.textContent=''; }
  catch(e){ exprEl.textContent=''; }
}

function inputChar(c){
  if(justEvaled && /[\d.]/.test(c)){ expr=''; lastResult=null; }
  justEvaled=false;
  expr+=c; display(); updatePreview();
}
function inputOp(op){
  justEvaled=false;
  if(expr==='' && lastResult!==null) expr=String(lastResult);
  expr+=op; display();
}
function inputConst(c){
  justEvaled=false;
  expr+= c==='PI' ? 'Math.PI' : 'Math.E';
  display(); updatePreview();
}
function inputChar2(c){ inputChar(c); }
function delLast(){ expr=expr.slice(0,-1); display(); updatePreview(); }
function clearAll(){ expr=''; lastResult=null; justEvaled=false; exprEl.textContent=''; resultEl.textContent='0'; }
function toggleSign(){
  if(!expr) return;
  if(expr.charAt(0)==='-') expr=expr.slice(1); else expr='-'+expr;
  display();
}

function fn(name){
  justEvaled=false;
  var v = expr!=='' ? evalExpr(expr) : null;
  if(v===null){ expr=name+'('; display(); return; }
  var r;
  switch(name){
    case 'sin':  r=Math.sin(toRad(v)); break;
    case 'cos':  r=Math.cos(toRad(v)); break;
    case 'tan':  r=Math.tan(toRad(v)); break;
    case 'asin': r=degMode?Math.asin(v)*180/Math.PI:Math.asin(v); break;
    case 'acos': r=degMode?Math.acos(v)*180/Math.PI:Math.acos(v); break;
    case 'atan': r=degMode?Math.atan(v)*180/Math.PI:Math.atan(v); break;
    case 'log':  r=Math.log10(v); break;
    case 'ln':   r=Math.log(v); break;
    case 'pow10':r=Math.pow(10,v); break;
    case 'exp':  r=Math.exp(v); break;
    case 'sqrt': r=Math.sqrt(v); break;
    case 'cbrt': r=Math.cbrt(v); break;
    case 'sq':   r=v*v; break;
    case 'cube': r=v*v*v; break;
    case 'abs':  r=Math.abs(v); break;
    case 'fact': r=factorial(Math.round(v)); break;
    default: r=NaN;
  }
  expr=String(fmt(r)); lastResult=r; display();
}
function factorial(n){ if(n<0||n>170) return NaN; if(n<=1) return 1; var r=1; for(var i=2;i<=n;i++) r*=i; return r; }

function evalExpr(s){
  s=s.replace(/÷/g,'/').replace(/×/g,'*');
  s=s.replace(/\^/g,'**');
  return Function('"use strict";return ('+s+')')();
}
function fmt(n){
  if(!isFinite(n)||isNaN(n)) return 'Error';
  if(Math.abs(n)>=1e12||( Math.abs(n)<1e-7 && n!==0)) return n.toExponential(6);
  var s=String(+n.toPrecision(12));
  return s;
}
function calculate(){
  if(!expr) return;
  try{
    var v=evalExpr(expr);
    exprEl.textContent=expr+' =';
    var fv=fmt(v);
    resultEl.textContent=fv;
    lastResult=v; expr=fv; justEvaled=true;
  }catch(e){ resultEl.textContent='Error'; expr=''; }
}
</script>
</body>
</html>
